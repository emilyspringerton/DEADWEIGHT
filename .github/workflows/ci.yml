name: DEADWEIGHT CI

on:
  push:
  pull_request:

permissions:
  contents: write

# Serialize runs per ref: parallel pushes all computed the same next tag (v0.1.0) at start and all but one lost the
# release race (run 2, 2026-09-18). Queued (not cancelled) so each run sees the previous run's tag; GitHub keeps only
# the newest pending run, which is fine because it builds the newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Every push builds + tests everything. Every green push to main auto-bumps the MINOR version, tags, and cuts a
# non-prerelease GitHub Release (non-prerelease so marcosnils/bin can install it) with the server, Windows client
# and APK attached. Same scheme as PARENA/KARAMBIT/BRAWLPIT ("i will handle big bumps to signify human verified
# releases"). Artifacts are built ONCE, already version-stamped, and the release job only publishes them.
jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
            if [ -z "$latest" ]; then major=0; minor=0; else
              ver="${latest#v}"; major="$(echo "$ver" | cut -d. -f1)"; minor="$(echo "$ver" | cut -d. -f2)"; fi
            tag="v${major}.$((minor + 1)).0"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  core:
    name: C core (ASan+UBSan tests, server, client)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test
        run: DW_VERSION=${{ needs.version.outputs.version }} scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ github.run_number }}
          path: |
            build/dw_server
            build/dw_client
          if-no-files-found: error

  windows:
    name: Windows cross-build (mingw)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 file
      - name: Build
        run: DW_VERSION=${{ needs.version.outputs.version }} scripts/build.sh --windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.run_number }}
          path: |
            build/dw_client.exe
            build/dw_server.exe
          if-no-files-found: error

  gui:
    name: SDL2 GUI (Linux + Windows, headless selftest)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 file libsdl2-dev patchelf zip imagemagick
          wget -q https://www.libsdl.org/release/SDL2-devel-2.28.5-mingw.tar.gz
          tar xzf SDL2-devel-2.28.5-mingw.tar.gz
          mv SDL2-2.28.5/x86_64-w64-mingw32 ./sdl2_mingw
      # Builds dw_gui (Linux) + dw_gui.exe (mingw), runs the headless selftest (SDL dummy video driver): the GUI plays a
      # full match against a real dw_server + dw_bot through its own state machine.
      - name: Build + selftest
        run: DW_VERSION=${{ needs.version.outputs.version }} SDL2_MINGW=./sdl2_mingw scripts/build.sh --gui --windows
      # A plain `gcc -lSDL2` build dynamically links libSDL2-2.0.so.0, absent on a typical fresh Linux box: bundle it and
      # point RPATH at $ORIGIN/lib (same mechanism BRAWLPIT/PITVIPER use).
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p pkg/lin/lib pkg/win
          cp build/dw_gui pkg/lin/dw_gui
          cp /usr/lib/x86_64-linux-gnu/libSDL2-2.0.so.0 pkg/lin/lib/
          patchelf --set-rpath '$ORIGIN/lib' pkg/lin/dw_gui
          tar -C pkg/lin -czf dw_gui_linux_x86_64.tar.gz dw_gui lib
          cp build/dw_gui.exe sdl2_mingw/bin/SDL2.dll pkg/win/
          (cd pkg/win && zip -q ../../dw_gui_windows.zip dw_gui.exe SDL2.dll)
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ github.run_number }}
          path: |
            dw_gui_linux_x86_64.tar.gz
            dw_gui_windows.zip
          if-no-files-found: error

  android:
    name: Android (JVM parity test + APK)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # android-actions/setup-android@v3 currently dies on `Failed to find package 'tools'` (first CI run, 2026-09-18).
      # ubuntu-latest already ships an Android SDK ($ANDROID_HOME) with cmdline-tools, so use its sdkmanager directly.
      # `yes | sdkmanager` under pipefail fails on yes's SIGPIPE even when sdkmanager succeeds (KARAMBIT, 2026-09-10).
      - name: Install Android SDK platform + build-tools
        run: |
          set -eu
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "sdkmanager: $SDKM"
          set +o pipefail
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;35.0.0"
      - name: Stamp version
        if: needs.version.outputs.tag != ''
        run: |
          sed -i \
            -e 's/"versionCode": "1"/"versionCode": "${{ github.run_number }}"/' \
            -e 's/"versionName": "0.0.0-dev"/"versionName": "${{ needs.version.outputs.version }}"/' \
            android/BUILD.bazel
      - name: Cross-target parity test (plain JVM)
        run: bazel run //android:core_test -- "$PWD/tests/parity_vectors.txt"
      - name: Session/protocol tests (plain JVM)
        run: bazel run //android:session_test
      - name: Build APK
        run: bazel build //android:deadweight
      - run: cp bazel-bin/android/deadweight.apk deadweight.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: deadweight.apk
          if-no-files-found: error

  release:
    name: Tag & Release
    needs: [version, core, windows, gui, android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir out
          cp artifacts/linux-*/dw_server "out/dw_server_linux_x86_64"
          cp artifacts/linux-*/dw_client "out/dw_client_linux_x86_64"
          cp artifacts/windows-*/dw_client.exe out/dw_client.exe
          cp artifacts/windows-*/dw_server.exe out/dw_server.exe
          cp artifacts/gui-*/dw_gui_linux_x86_64.tar.gz out/
          cp artifacts/gui-*/dw_gui_windows.zip out/
          cp artifacts/android-*/deadweight.apk "out/deadweight-${TAG}.apk"
          # Create the tag server-side via the release API (--target). A plain `git push origin $TAG` from the runner is
          # rejected ("refusing to allow a GitHub App to create or update workflow ... without `workflows`
          # permission") because the GITHUB_TOKEN treats the workflow file in history as part of the new ref.
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
