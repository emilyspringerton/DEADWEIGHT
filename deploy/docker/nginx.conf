server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx:alpine's default mime.types does not include .wasm -- without this, browsers get
    # served application/octet-stream and refuse WebAssembly.instantiateStreaming(), silently
    # falling back to a slower non-streaming compile path (or failing outright on strict CSPs).
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types application/wasm application/javascript application/json text/css text/html;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
